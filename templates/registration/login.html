{% extends "base.html" %}
{% block title %}Login | RecruitHub{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-6 col-lg-5">
<div class="card shadow-sm border-0">
<div class="card-body p-4">
<h2 class="fw-bold mb-1">Welcome back</h2>
<p class="text-muted mb-4">Login as admin or candidate.</p>
<form method="post">{% csrf_token %}
{{ form.non_field_errors }}
<div class="mb-3"><label class="form-label">Username</label>{{ form.username }}</div>
<div class="mb-3"><label class="form-label">Password</label>{{ form.password }}</div>
<button class="btn btn-primary w-100">Login</button>
</form>
<p class="text-end mt-2"><a href="{% url 'password_reset' %}">Forgot password?</a></p>
<hr>
<p class="text-center mb-0">New candidate? <a href="{% url 'register' %}">Create account</a></p>
</div></div></div></div>
{% endblock %}
