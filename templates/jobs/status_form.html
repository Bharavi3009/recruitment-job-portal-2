{% extends "base.html" %}
{% block title %}Update Status | RecruitHub{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<div class="card border-0 shadow-sm"><div class="card-body p-4">
<h3 class="fw-bold">Update Application</h3>
<p>{{ application.candidate.get_full_name|default:application.candidate.username }} — {{ application.job.title }}</p>
<form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label">Status</label>{{ form.status }}</div>
<button class="btn btn-primary">Save Status</button><a class="btn btn-outline-secondary" href="{% url 'application_list' %}">Cancel</a></form>
</div></div></div></div>
{% endblock %}
