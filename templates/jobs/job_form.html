{% extends "base.html" %}
{% block title %}{{ title }} | RecruitHub{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-9">
<div class="card shadow-sm border-0"><div class="card-body p-4">
<h2 class="fw-bold">{{ title }}</h2>
<form method="post">{% csrf_token %}
{% for field in form %}
<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}
{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>
{% endfor %}
<button class="btn btn-primary">Save Job</button><a class="btn btn-outline-secondary" href="{% url 'dashboard' %}">Cancel</a>
</form>
</div></div></div></div>
{% endblock %}
